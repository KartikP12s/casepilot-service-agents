name: casepilot
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-only}
      POSTGRES_DB: casepilot
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["app-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casepilot"]
      interval: 3s
      retries: 20
  service-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casepilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-database-only}
      POSTGRES_DB: service
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["service-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casepilot"]
      interval: 3s
      retries: 20
  service:
    build: .
    command: ["uvicorn", "casepilot.service:create_service", "--factory", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      SERVICE_DATABASE_URL: postgresql+psycopg://casepilot:${POSTGRES_PASSWORD:-local-database-only}@service-db:5432/service
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-service-only}
    depends_on:
      service-db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://casepilot:${POSTGRES_PASSWORD:-local-database-only}@db:5432/casepilot
      SERVICE_URL: http://service:8001
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-service-only}
      USER_TOKEN: ${USER_TOKEN:-local-user-only}
      APPROVER_TOKEN: ${APPROVER_TOKEN:-local-approver-only}
      VIEWER_TOKEN: ${VIEWER_TOKEN:-local-viewer-only}
      CORS_ORIGIN: http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["checkpoints:/app/data"]
    depends_on:
      db: {condition: service_healthy}
      service: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      retries: 20
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:8080"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  app-db:
  service-db:
  checkpoints:
